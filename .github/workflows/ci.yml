name: Validation and CPU tests

on:
  pull_request:
  push:
    branches: [main]

# Cancel obsolete pushes to the same PR/branch instead of installing R
# repeatedly for commits that have already been superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  structure:
    name: Algorithm metadata and layout
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate algorithm metadata and directory layout
        run: python3 scripts/validate_repository.py

  language:
    name: ${{ matrix.language }} reference implementations
    needs: structure
    strategy:
      fail-fast: false
      matrix:
        language: [c, python, rust, r]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        if: matrix.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Rust
        if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@stable
      - name: Set up R
        if: matrix.language == 'r'
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
      - name: Run declared language tests
        run: python3 scripts/run_tests.py --strict --language ${{ matrix.language }}

# CUDA is opt-in because public hosted Ubuntu jobs do not guarantee a
# compatible NVIDIA GPU. The CPU matrix does not claim GPU coverage.
